version: 2
updates:
  - package-ecosystem: uv
    directory: /agents
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    target-branch: dev
    ignore:
      # Majors wait until the lint toolchain supports them: typescript-eslint needs
      # TypeScript < 6.1, and eslint-config-next's plugins stop at ESLint 9.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Types follow the Node major the app runs on (node:24 images and CI).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
