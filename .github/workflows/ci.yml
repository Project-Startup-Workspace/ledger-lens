name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tag is published
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build # includes the TypeScript check

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag is published
        with:
          enable-cache: true
      - name: Start the Firestore and Cloud Storage emulators
        working-directory: .
        run: |
          docker run -d --name firestore -p 8681:8681 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators gcloud emulators firestore start --host-port=0.0.0.0:8681
          docker run -d --name storage -p 4443:4443 fsouza/fake-gcs-server -scheme http -port 4443 -public-host localhost:4443
      - run: uv sync --locked --all-extras
      - name: Wait for the emulators
        run: timeout 120 sh -c 'until curl -s localhost:8681 && curl -s localhost:4443/storage/v1/b; do sleep 2; done'
      - name: Integration tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8681
          STORAGE_EMULATOR_HOST: http://localhost:4443
          GOOGLE_CLOUD_PROJECT: ledger-lens-test
        run: uv run pytest -m integration

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the ${{ matrix.image }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action needs a paid licence for org repos; the CLI does not.
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
