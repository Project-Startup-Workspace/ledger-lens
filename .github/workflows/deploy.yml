name: Deploy

# Every merge to main deploys the dev environment. The job is skipped until the GCP
# repository variables from infra/gcp/bootstrap.sh are set.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub prove its identity to Google Cloud (no JSON keys)

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/ledger-lens
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push images
        run: |
          docker build -f infra/docker/api.Dockerfile -t "$REGISTRY/api:$TAG" .
          docker build -f infra/docker/web.Dockerfile -t "$REGISTRY/web:$TAG" .
          docker push "$REGISTRY/api:$TAG"
          docker push "$REGISTRY/web:$TAG"

      # The API is open at the Cloud Run layer because Cloud Run IAM would claim the same
      # Authorization header; the app itself requires LL_API_TOKEN on every call but /health.
      - name: Deploy API
        run: >
          gcloud run deploy ledger-lens-api --image "$REGISTRY/api:$TAG"
          --region "${{ vars.GCP_REGION }}" --service-account "${{ vars.RUNTIME_SA }}"
          --allow-unauthenticated --memory 1Gi --timeout 300
          --set-env-vars "LL_LLM_PROVIDER=vertex,LL_GCP_PROJECT=${{ vars.GCP_PROJECT }},LL_GCP_REGION=${{ vars.GCP_REGION }},LL_STORAGE_BACKEND=gcp,LL_EVIDENCE_BUCKET=${{ vars.EVIDENCE_BUCKET }},LL_AUDIT_BUCKET=${{ vars.AUDIT_BUCKET }},LL_AUDIT_KMS_KEY=${{ vars.AUDIT_KMS_KEY }}"
          --set-secrets "LL_API_TOKEN=ll-api-token:latest"

      # Callers authenticate with Google identity tokens (Cloud Run IAM).
      - name: Deploy AuditPulse A2A
        run: |
          gcloud run deploy ledger-lens-a2a --image "$REGISTRY/api:$TAG" \
            --region "${{ vars.GCP_REGION }}" --service-account "${{ vars.RUNTIME_SA }}" \
            --no-allow-unauthenticated \
            --command sh --args "-c,uvicorn ledger_lens.a2a_server:app --host 0.0.0.0 --port \$PORT"
          URL="$(gcloud run services describe ledger-lens-a2a --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')"
          gcloud run services update ledger-lens-a2a --region "${{ vars.GCP_REGION }}" \
            --update-env-vars "LL_A2A_PUBLIC_URL=$URL"

      - name: Deploy web
        run: |
          API_URL="$(gcloud run services describe ledger-lens-api --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')"
          gcloud run deploy ledger-lens-web --image "$REGISTRY/web:$TAG" \
            --region "${{ vars.GCP_REGION }}" --service-account "${{ vars.RUNTIME_SA }}" \
            --allow-unauthenticated \
            --set-env-vars "LL_API_URL=$API_URL" \
            --set-secrets "LL_API_TOKEN=ll-api-token:latest,LL_WEB_USERS=ll-web-users:latest"
