name: Deploy

# Deploys the dev environment after CI passes on main. Skipped until the GCP repository
# variables printed by infra/gcp/bootstrap.sh are set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub prove its identity to Google Cloud (no JSON keys)

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # Only CI runs triggered by a push to main (never a pull request, even one whose
    # source branch is named main), or a manual run started on main.
    if: >
      vars.WIF_PROVIDER != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    env:
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/ledger-lens
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }} # exactly the commit CI tested
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v4

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ env.TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/web:${{ env.TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Instance caps bound the bill: each instance serves many requests at once, and
      # LL_DAILY_MODEL_CALLS bounds Gemini spend across all of them.
      # The API is open at the Cloud Run layer because Cloud Run IAM would claim the same
      # Authorization header; the app itself requires LL_API_TOKEN on every call but /health.
      - name: Deploy API
        run: >
          gcloud run deploy ledger-lens-api --image "$REGISTRY/api:$TAG"
          --region "$REGION" --service-account "${{ vars.RUNTIME_SA }}"
          --allow-unauthenticated --memory 1Gi --timeout 300 --max-instances 2
          --set-env-vars "LL_DAILY_MODEL_CALLS=${{ vars.DAILY_MODEL_CALLS || 300 }},LL_LLM_PROVIDER=vertex,LL_GCP_PROJECT=${{ vars.GCP_PROJECT }},LL_GCP_REGION=$REGION,LL_STORAGE_BACKEND=gcp,LL_EVIDENCE_BUCKET=${{ vars.EVIDENCE_BUCKET }},LL_AUDIT_BUCKET=${{ vars.AUDIT_BUCKET }},LL_AUDIT_KMS_KEY=${{ vars.AUDIT_KMS_KEY }},LL_IDENTITY_BACKEND=${{ vars.FIREBASE_API_KEY != '' && 'gcp' || 'local' }}"
          --set-secrets "LL_API_TOKEN=ll-api-token:latest"

      # Callers authenticate with Google identity tokens (Cloud Run IAM). Cloud Run URLs are
      # deterministic, so the agent card gets its public URL in the same deploy.
      - name: Deploy AuditPulse A2A
        run: |
          NUMBER="$(gcloud projects describe "${{ vars.GCP_PROJECT }}" --format 'value(projectNumber)')"
          gcloud run deploy ledger-lens-a2a --image "$REGISTRY/api:$TAG" \
            --region "$REGION" --service-account "${{ vars.RUNTIME_SA }}" \
            --no-allow-unauthenticated --max-instances 1 \
            --set-env-vars "LL_A2A_PUBLIC_URL=https://ledger-lens-a2a-$NUMBER.$REGION.run.app,LL_GCP_PROJECT=${{ vars.GCP_PROJECT }}" \
            --command sh --args "-c,uvicorn ledger_lens.a2a_server:app --host 0.0.0.0 --port \$PORT"

      # Sign-in: Firebase Authentication with roles when FIREBASE_API_KEY is set
      # (infra/gcp/firebase-auth.sh); else Identity-Aware Proxy when IAP_AUDIENCE is set;
      # else the HTTP Basic users in the ll-web-users secret.
      - name: Deploy web
        env:
          IAP_AUDIENCE: ${{ vars.IAP_AUDIENCE }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
        run: |
          API_URL="$(gcloud run services describe ledger-lens-api --region "$REGION" --format 'value(status.url)')"
          if [ -n "$FIREBASE_API_KEY" ]; then
            AUTH_ENV=",LL_FIREBASE_PROJECT=${{ vars.GCP_PROJECT }},LL_FIREBASE_API_KEY=$FIREBASE_API_KEY"
            SECRETS="LL_API_TOKEN=ll-api-token:latest"
          elif [ -n "$IAP_AUDIENCE" ]; then
            AUTH_ENV=",LL_IAP_AUDIENCE=$IAP_AUDIENCE"; SECRETS="LL_API_TOKEN=ll-api-token:latest"
          else
            AUTH_ENV=""; SECRETS="LL_API_TOKEN=ll-api-token:latest,LL_WEB_USERS=ll-web-users:latest"
          fi
          gcloud run deploy ledger-lens-web --image "$REGISTRY/web:$TAG" \
            --region "$REGION" --service-account "${{ vars.WEB_SA }}" \
            --allow-unauthenticated --max-instances 2 \
            --set-env-vars "LL_API_URL=$API_URL$AUTH_ENV" --set-secrets "$SECRETS"

      # Firebase Hosting serves the public link and forwards every request to the web
      # service. Signed-in responses are marked private, so its CDN never caches them.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Publish Firebase Hosting
        run: >
          npx --yes firebase-tools@15.32.1 deploy --only hosting --non-interactive
          --project "${{ vars.GCP_PROJECT }}" --config infra/firebase/firebase.json
